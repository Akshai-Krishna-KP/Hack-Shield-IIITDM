
{% extends "base.html" %}
{% block title %}Login | ByteForge Technologies{% endblock %}

{% block content %}
<section class="login-panel">
    <span class="eyebrow">SECURE EMPLOYEE ACCESS</span>
    <h1>Welcome back</h1>
    <p class="muted">Sign in to access your employee workspace.</p>

    {% if error %}
        <div class="alert">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">
        <label for="username">Username</label>
        <input id="username" name="username"
               type="text" required autocomplete="username">

        <label for="password">Password</label>
        <input id="password" name="password"
               type="password" required
               autocomplete="current-password">
               
         <!-- default credentials - employee:employee  -->

        <button class="button full" type="submit">Sign In</button>
    </form>

    <p class="hint">
        Authorized employees only.
    </p>
</section>
{% endblock %}
